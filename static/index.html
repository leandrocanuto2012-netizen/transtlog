<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Integrado de Gestão - ERP | WMS | CRM | VOM | PDA | SAP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .tab-active { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; }
  .card-hover { transition: all 0.2s; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .modal-bg { background: rgba(0,0,0,0.5); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  .badge { padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  table { font-size: 13px; }
  .nav-item { cursor: pointer; transition: all 0.15s; }
  .nav-item:hover { background: #f1f5f9; }
  .nav-item.active { background: #dbeafe; color: #1e40af; border-left: 3px solid #2563eb; }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col fixed h-full overflow-y-auto">
    <div class="p-5 border-b border-slate-700">
      <h1 class="text-lg font-bold">Sistema de Gestão</h1>
      <p class="text-xs text-slate-400 mt-1">Integrado Multi-Módulo</p>
    </div>
    <nav class="flex-1 py-4" id="sidebar-nav">
      <div class="nav-item active px-5 py-3 flex items-center gap-3" data-view="dashboard">
        <span class="text-lg">📊</span> Dashboard Geral
      </div>
      <div class="px-5 py-2 text-xs text-slate-500 uppercase tracking-wider mt-2">Módulos</div>
      <div class="nav-item px-5 py-3 flex items-center gap-3" data-view="erp"><span>🏢</span> ERP</div>
      <div class="nav-item px-5 py-3 flex items-center gap-3" data-view="wms"><span>📦</span> WMS</div>
      <div class="nav-item px-5 py-3 flex items-center gap-3" data-view="crm"><span>👥</span> CRM</div>
      <div class="nav-item px-5 py-3 flex items-center gap-3" data-view="vom"><span>🤝</span> VOM</div>
      <div class="nav-item px-5 py-3 flex items-center gap-3" data-view="pda"><span>🏭</span> PDA</div>
      <div class="nav-item px-5 py-3 flex items-center gap-3" data-view="sap"><span>💰</span> SAP Contábil</div>
      <div class="px-5 py-2 text-xs text-slate-500 uppercase tracking-wider mt-2">Integração</div>
      <div class="nav-item px-5 py-3 flex items-center gap-3" data-view="logs"><span>🔄</span> Logs Integração</div>
    </nav>
    <div class="p-4 border-t border-slate-700 text-xs text-slate-400">
      <div id="health-status">Verificando...</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 ml-64 p-6">
    <div id="content"></div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 modal-bg hidden items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4">
    <div class="p-5 border-b flex justify-between items-center sticky top-0 bg-white">
      <h3 id="modal-title" class="text-lg font-bold text-slate-800"></h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
    </div>
    <div id="modal-body" class="p-5"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 hidden z-50 px-6 py-3 rounded-lg shadow-lg text-white font-medium"></div>

<script>
const API = '';
let currentView = 'dashboard';

// ============================================================
// UTILITÁRIOS
// ============================================================
async function api(url, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.erro || 'Erro na requisição');
  return data;
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `fixed bottom-6 right-6 z-50 px-6 py-3 rounded-lg shadow-lg text-white font-medium ${type==='success'?'bg-green-600':'bg-red-600'}`;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3500);
}

function openModal(title, bodyHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').classList.add('flex');
}
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal').classList.remove('flex');
}

function fmtMoney(v) { return 'R$ ' + (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('pt-BR'); }

function statusBadge(status) {
  const colors = {
    'ATIVO':'bg-green-100 text-green-700','APROVADO':'bg-green-100 text-green-700','PAGO':'bg-green-100 text-green-700',
    'CONCLUIDA':'bg-green-100 text-green-700','CONCLUIDO':'bg-green-100 text-green-700','FINALIZADO':'bg-green-100 text-green-700',
    'FATURADO':'bg-blue-100 text-blue-700','LIBERADA':'bg-blue-100 text-blue-700','VALIDADO':'bg-blue-100 text-blue-700',
    'PENDENTE':'bg-yellow-100 text-yellow-700','ABERTA':'bg-yellow-100 text-yellow-700','ABERTO':'bg-yellow-100 text-yellow-700',
    'EM_PRODUCAO':'bg-blue-100 text-blue-700','EM_SEPARACAO':'bg-blue-100 text-blue-700','EM_ANALISE':'bg-purple-100 text-purple-700',
    'SOLICITADO':'bg-yellow-100 text-yellow-700','DOCUMENTACAO':'bg-yellow-100 text-yellow-700','CADASTRADO':'bg-green-100 text-green-700',
    'ATRASADO':'bg-red-100 text-red-700','REJEITADO':'bg-red-100 text-red-700','CANCELADO':'bg-slate-200 text-slate-600',
    'ORCAMENTO':'bg-slate-100 text-slate-600','PLANEJADA':'bg-slate-100 text-slate-600','RASCUNHO':'bg-slate-100 text-slate-600',
    'APURADO':'bg-yellow-100 text-yellow-700','PERDIDA':'bg-red-100 text-red-700','FECHADA':'bg-green-100 text-green-700',
    'DISPONIVEL':'bg-green-100 text-green-700','OCUPADO':'bg-orange-100 text-orange-700','BLOQUEADO':'bg-red-100 text-red-700',
    'AGUARDANDO':'bg-yellow-100 text-yellow-700','EM_CONFERENCIA':'bg-blue-100 text-blue-700','CONFERIDO':'bg-blue-100 text-blue-700',
    'ENDERECADO':'bg-indigo-100 text-indigo-700','SUSPENSO':'bg-red-100 text-red-700','INATIVO':'bg-slate-200 text-slate-600'
  };
  return `<span class="badge ${colors[status]||'bg-slate-100 text-slate-600'}">${status}</span>`;
}

function tableHTML(headers, rows) {
  return `<div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="bg-slate-50 border-b">
    ${headers.map(h=>`<th class="px-3 py-2 font-semibold text-slate-600 text-xs uppercase">${h}</th>`).join('')}
  </tr></thead><tbody>${rows.map(r=>`<tr class="border-b hover:bg-slate-50">${r.map(c=>`<td class="px-3 py-2">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function statCard(label, value, color='blue', icon='') {
  const colors = {blue:'from-blue-500 to-blue-600', green:'from-green-500 to-green-600', red:'from-red-500 to-red-600', yellow:'from-yellow-500 to-yellow-600', purple:'from-purple-500 to-purple-600', indigo:'from-indigo-500 to-indigo-600', orange:'from-orange-500 to-orange-600'};
  return `<div class="bg-white rounded-xl p-5 shadow-sm card-hover">
    <div class="flex justify-between items-start">
      <div><p class="text-xs text-slate-500 uppercase font-semibold">${label}</p>
      <p class="text-2xl font-bold text-slate-800 mt-1">${value}</p></div>
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br ${colors[color]} flex items-center justify-center text-white text-lg">${icon}</div>
    </div></div>`;
}

function btn(label, onclick, color='blue') {
  const colors = {blue:'bg-blue-600 hover:bg-blue-700', green:'bg-green-600 hover:bg-green-700', red:'bg-red-600 hover:bg-red-700', slate:'bg-slate-600 hover:bg-slate-700', purple:'bg-purple-600 hover:bg-purple-700'};
  return `<button onclick="${onclick}" class="${colors[color]} text-white px-4 py-2 rounded-lg text-sm font-medium transition">${label}</button>`;
}

function input(label, name, type='text', value='', required=true) {
  return `<div><label class="block text-xs font-semibold text-slate-600 mb-1">${label}</label>
  <input name="${name}" type="${type}" value="${value}" ${required?'required':''} class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"></div>`;
}

// ============================================================
// NAVEGAÇÃO
// ============================================================
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    currentView = el.dataset.view;
    renderView();
  });
});

async function renderView() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="text-center py-20 text-slate-400">Carregando...</div>';
  try {
    const views = {dashboard: renderDashboard, erp: renderERP, wms: renderWMS, crm: renderCRM, vom: renderVOM, pda: renderPDA, sap: renderSAP, logs: renderLogs};
    await views[currentView]();
  } catch(e) {
    c.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-xl">Erro ao carregar: ${e.message}</div>`;
  }
}

// ============================================================
// DASHBOARD GERAL
// ============================================================

  c.innerHTML = `
    <h2 class="text-2xl font-bold text-slate-800 mb-1">Dashboard Geral</h2>
    <p class="text-slate-500 text-sm mb-6">Visão consolidada de todos os módulos integrados</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${statCard('Produtos ERP', d.erp.produtos_cadastrados, 'blue', '🏢')}
      ${statCard('Clientes CRM', d.crm.clientes, 'green', '👥')}
      ${statCard('Fornecedores', d.erp.fornecedores, 'purple', '🤝')}
      ${statCard('Armazéns WMS', d.wms.armazens, 'orange', '📦')}
      ${statCard('Contas a Pagar', d.erp.contas_pagar_abertas, 'red', '💸')}
      ${statCard('Contas a Receber', d.erp.contas_receber_abertas, 'green', '💰')}
      ${statCard('Oportunidades', d.crm.oportunidades_abertas, 'indigo', '🎯')}
      ${statCard('OEE Produção', d.pda.oee_medio + '%', 'blue', '🏭')}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <h3 class="font-bold text-slate-800 mb-4">Fluxo de Caixa (30 dias)</h3>
        <div class="space-y-3">
          <div class="flex justify-between"><span class="text-slate-600">Total a Receber</span><span class="font-bold text-green-600">${fmtMoney(d.erp.fluxo_caixa_30d.total_a_receber)}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Total a Pagar</span><span class="font-bold text-red-600">${fmtMoney(d.erp.fluxo_caixa_30d.total_a_pagar)}</span></div>
          <div class="border-t pt-3 flex justify-between"><span class="font-semibold">Saldo Previsto</span><span class="font-bold ${d.erp.fluxo_caixa_30d.saldo_previsto>=0?'text-green-600':'text-red-600'}">${fmtMoney(d.erp.fluxo_caixa_30d.saldo_previsto)}</span></div>
        </div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <h3 class="font-bold text-slate-800 mb-4">Funil de Vendas (CRM)</h3>
        ${tableHTML(['Estágio','Qtd','Valor','Valor Ponderado'], d.crm.funil_vendas.map(f=>[f.estagio, f.quantidade, fmtMoney(f.valor_total), fmtMoney(f.valor_ponderado)]))}
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <h3 class="font-bold text-slate-800 mb-4">Ocupação WMS</h3>
        ${tableHTML(['Armazém','Ocupação','%','Endereços Disp.'], d.wms.ocupacao.map(o=>[o.armazem, `${o.ocupacao_atual}/${o.capacidade_total}`, o.percentual_ocupacao+'%', o.enderecos_disponiveis]))}
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <h3 class="font-bold text-slate-800 mb-4">Produção (PDA) - 30 dias</h3>
        <div class="grid grid-cols-2 gap-3">

          <div class="bg-slate-50 p-3 rounded-lg"><p class="text-xs text-slate-500">Refugo</p><p class="font-bold text-lg text-red-600">${d.pda.total_refugo}</p></div>
          <div class="bg-slate-50 p-3 rounded-lg"><p class="text-xs text-slate-500">Qualidade</p><p class="font-bold text-lg text-green-600">${d.pda.taxa_qualidade}%</p></div>
          <div class="bg-slate-50 p-3 rounded-lg"><p class="text-xs text-slate-500">Taxa Conclusão OP</p><p class="font-bold text-lg">${d.pda.taxa_conclusao}%</p></div>

// ============================================================
// ERP
// ============================================================
async function renderERP() {
  const [produtos, fornecedores, cp, cr, mov, baixo] = await Promise.all([
    api('/api/erp/produtos'), api('/api/erp/fornecedores'),
    api('/api/erp/contas-pagar'), api('/api/erp/contas-receber'),
    api('/api/erp/movimentacoes-estoque'), api('/api/erp/produtos/estoque-baixo')
  ]);
  document.getElementById('content').innerHTML = `
    <h2 class="text-2xl font-bold text-slate-800 mb-1">ERP - Enterprise Resource Planning</h2>
    <p class="text-slate-500 text-sm mb-6">Gestão de produtos, compras, estoque e financeiro</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${statCard('Produtos', produtos.length, 'blue', '📦')}
      ${statCard('Fornecedores', fornecedores.length, 'purple', '🏭')}
      ${statCard('Contas a Pagar', cp.filter(c=>c.status!=='PAGO').length, 'red', '💸')}
      ${statCard('Estoque Baixo', baixo.length, 'yellow', '⚠️')}
    </div>
    ${baixo.length>0?`<div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-6"><p class="font-semibold text-yellow-800 mb-2">⚠️ Alerta de Estoque Baixo</p>
      ${tableHTML(['SKU','Produto','Estoque','Mínimo'], baixo.map(b=>[b.sku,b.nome,b.estoque,b.minimo]))}</div>`:''}
    <div class="bg-white rounded-xl shadow-sm mb-6">
      <div class="p-5 border-b flex justify-between items-center"><h3 class="font-bold">Produtos</h3>
        ${btn('+ Novo Produto', 'formProduto()', 'blue')}</div>
      <div class="p-5">${tableHTML(['SKU','Nome','Categoria','Custo','Venda','Margem','Estoque','Status'],
        produtos.map(p=>[p.codigo_sku, p.nome, p.categoria||'-', fmtMoney(p.preco_custo), fmtMoney(p.preco_venda), p.margem_lucro+'%', p.estoque_atual, p.ativo?'Ativo':'Inativo']))}</div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl shadow-sm"><div class="p-5 border-b"><h3 class="font-bold">Fornecedores</h3></div>
        <div class="p-5">${tableHTML(['CNPJ','Razão Social','Status','Limite'], fornecedores.map(f=>[f.cnpj, f.razao_social, statusBadge(f.status_aprovacao), fmtMoney(f.limite_credito)]))}</div></div>
      <div class="bg-white rounded-xl shadow-sm"><div class="p-5 border-b"><h3 class="font-bold">Contas a Pagar / Receber</h3></div>
        <div class="p-5"><p class="font-semibold text-sm mb-2 text-red-600">A Pagar</p>
          ${tableHTML(['Descrição','Vencimento','Valor','Status'], cp.slice(0,5).map(c=>[c.descricao, fmtDate(c.data_vencimento), fmtMoney(c.valor_original), statusBadge(c.status)]))}
          <p class="font-semibold text-sm mb-2 mt-4 text-green-600">A Receber</p>
          ${tableHTML(['Descrição','Vencimento','Valor','Status'], cr.slice(0,5).map(c=>[c.descricao, fmtDate(c.data_vencimento), fmtMoney(c.valor_original), statusBadge(c.status)]))}</div></div>
    </div>
    <div class="bg-white rounded-xl shadow-sm mt-6"><div class="p-5 border-b"><h3 class="font-bold">Últimas Movimentações de Estoque</h3></div>
      <div class="p-5">${tableHTML(['Produto ID','Tipo','Qtd','Saldo Ant.','Saldo Atual','Origem','Data'],
        mov.slice(0,10).map(m=>[m.produto_id, m.tipo, m.quantidade, m.saldo_anterior, m.saldo_atual, m.origem, fmtDate(m.criado_em)]))}</div></div>`;
}

function formProduto() {
  openModal('Novo Produto', `
    <form id="form-prod" class="space-y-3">
      ${input('SKU','codigo_sku')}
      ${input('Nome','nome')}
      <div class="grid grid-cols-2 gap-3">
        ${input('Categoria','categoria','text','',false)}
        ${input('Unidade','unidade_medida','text','UN')}
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${input('Preço Custo','preco_custo','number','0')}
        ${input('Preço Venda','preco_venda','number','0')}
      </div>
      <div class="grid grid-cols-3 gap-3">
        ${input('Estoque Mínimo','estoque_minimo','number','0')}
        ${input('Estoque Máximo','estoque_maximo','number','0')}
        ${input('Estoque Atual','estoque_atual','number','0')}
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700">Cadastrar</button>
    </form>`);
  document.getElementById('form-prod').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const dados = Object.fromEntries(fd.entries());
    ['preco_custo','preco_venda','estoque_minimo','estoque_maximo','estoque_atual'].forEach(k=>dados[k]=parseFloat(dados[k])||0);
    try { await api('/api/erp/produtos','POST',dados); toast('Produto cadastrado!'); closeModal(); renderView(); }
    catch(err) { toast(err.message,'error'); }
  };
}

// ============================================================
// WMS
// ============================================================
async function renderWMS() {
  const [arm, end, os, rec, inv, ocup] = await Promise.all([
    api('/api/wms/armazens'), api('/api/wms/enderecos'),
    api('/api/wms/ordens-separacao'), api('/api/wms/recebimentos'),
    api('/api/wms/inventarios'), api('/api/wms/relatorios/ocupacao')
  ]);
  document.getElementById('content').innerHTML = `
    <h2 class="text-2xl font-bold text-slate-800 mb-1">WMS - Warehouse Management System</h2>
    <p class="text-slate-500 text-sm mb-6">Gestão de armazém, endereçamento, separação e inventário</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${statCard('Armazéns', arm.length, 'orange', '🏬')}
      ${statCard('Endereços', end.length, 'blue', '📍')}
      ${statCard('Separações Pendentes', os.filter(o=>o.status==='PENDENTE').length, 'yellow', '📋')}
      ${statCard('Inventários', inv.length, 'purple', '🔍')}
    </div>
    <div class="bg-white rounded-xl shadow-sm mb-6"><div class="p-5 border-b"><h3 class="font-bold">Ocupação por Armazém</h3></div>
      <div class="p-5">${tableHTML(['Armazém','Capacidade','Ocupado','% Ocupação','Endereços','Disponíveis'],
        ocup.map(o=>[o.armazem, o.capacidade_total, o.ocupacao_atual, o.percentual_ocupacao+'%', o.enderecos_total, o.enderecos_disponiveis]))}</div></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl shadow-sm"><div class="p-5 border-b flex justify-between"><h3 class="font-bold">Ordens de Separação</h3>
        ${btn('+ Nova OS', 'formOS()','blue')}</div>
        <div class="p-5">${tableHTML(['Número','Status','Prioridade','Criação'], os.map(o=>[o.numero, statusBadge(o.status), o.prioridade, fmtDate(o.criado_em)]))}</div></div>
      <div class="bg-white rounded-xl shadow-sm"><div class="p-5 border-b"><h3 class="font-bold">Recebimentos</h3></div>
        <div class="p-5">${tableHTML(['Número','Status','Chegada'], rec.map(r=>[r.numero, statusBadge(r.status), fmtDate(r.data_chegada)]))}</div></div>
    </div>
    <div class="bg-white rounded-xl shadow-sm mt-6"><div class="p-5 border-b flex justify-between"><h3 class="font-bold">Endereços de Armazenagem</h3>
      ${btn('+ Novo Endereço','formEndereco()','blue')}</div>
      <div class="p-5">${tableHTML(['Código','Rua','Módulo','Nível','Posição','Capacidade','Ocupado','Status'],
        end.slice(0,15).map(e=>[e.codigo, e.rua, e.modulo, e.nivel, e.posicao, e.capacidade, e.ocupacao_atual, statusBadge(e.status)]))}</div></div>`;
}

function formOS() {
  openModal('Nova Ordem de Separação', `

}
function addPartida() {
  document.getElementById('partidas').insertAdjacentHTML('beforeend', `<div class="grid grid-cols-3 gap-2 mb-2">
    <select name="tipo" class="px-3 py-2 border rounded text-sm"><option value="DEBITO">Débito</option><option value="CREDITO">Crédito</option></select>
    <input name="plano_conta_id" placeholder="Conta ID" type="number" class="px-3 py-2 border rounded text-sm">
    <input name="valor" placeholder="Valor" type="number" step="0.01" class="px-3 py-2 border rounded text-sm"></div>`);
}

function formApuracao() {
  openModal('Apurar Imposto', `
    <form id="form-apur" class="space-y-3">
      ${input('Competência (MM/AAAA)','competencia','text','10/2026')}
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Imposto</label>
        <select name="imposto_nome" class="w-full px-3 py-2 border rounded-lg text-sm">
          <option>ICMS</option><option>PIS</option><option>COFINS</option><option>IPI</option><option>ISS</option><option>IRPJ</option><option>CSLL</option>
        </select></div>
      ${input('Base de Cálculo','base_calculo','number')}
      <button type="submit" class="w-full bg-red-600 text-white py-2.5 rounded-lg font-medium hover:bg-red-700">Apurar</button>
    </form>`);
  document.getElementById('form-apur').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try { const r = await api('/api/sap/apuracoes','POST',{competencia:fd.get('competencia'), imposto_nome:fd.get('imposto_nome'), base_calculo:parseFloat(fd.get('base_calculo'))}); toast(`Imposto apurado: ${fmtMoney(r.valor_apurado)}`); closeModal(); renderView(); }
    catch(err) { toast(err.message,'error'); }
  };
}

// ============================================================
// LOGS DE INTEGRAÇÃO
// ============================================================
async function renderLogs() {
  const logs = await api('/api/integracao/logs');
  document.getElementById('content').innerHTML = `
    <h2 class="text-2xl font-bold text-slate-800 mb-1">Logs de Integração entre Módulos</h2>
    <p class="text-slate-500 text-sm mb-6">Rastreabilidade de todas as integrações ERP↔WMS↔CRM↔VOM↔PDA↔SAP</p>
    <div class="mb-4">${btn('Processar Fila Pendente','processarFila()','green')}</div>
    <div class="bg-white rounded-xl shadow-sm"><div class="p-5">
      ${tableHTML(['ID','Origem','→ Destino','Operação','Entidade','Status','Data'],
        logs.map(l=>[l.id, l.modulo_origem, l.modulo_destino, l.tipo_operacao, l.entidade, statusBadge(l.status), fmtDate(l.data_tentativa)]))}</div></div>`;
}

async function processarFila() {
  const r = await api('/api/integracao/processar-fila','POST');
  toast(`${r.processados} logs processados!`);
  renderView();
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
async function checkHealth() {
  try {
    const h = await api('/health');
    document.getElementById('health-status').innerHTML = `<span class="text-green-400">● Conectado</span><br><span class="text-slate-500">Módulos: ${h.modulos.join(', ')}</span>`;
  } catch(e) {
    document.getElementById('health-status').innerHTML = '<span class="text-red-400">● Offline</span>';
  }
}

checkHealth();
renderView();
</script>
